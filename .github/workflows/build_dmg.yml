name: Build macOS DMG
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller dmgbuild
      - name: Build App
        run: pyinstaller QectorWorkbench.spec
      - name: Build DMG
        run: dmgbuild -s scripts/dmg_settings.py "QECTOR Workbench" dist/QectorWorkbench.dmg
